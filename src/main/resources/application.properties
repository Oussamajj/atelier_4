spring.application.name=oussama-kafka-analytics
server.port=8080

# --- Fonctions Spring Cloud Stream ---
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;kafkaStreamFunction

# --- Consumer : lit T2 ---
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=oussama-page-consumer
spring.cloud.stream.bindings.pageEventConsumer-in-0.contentType=application/json

# --- Supplier : produit un evenement toutes les 200 ms dans T3 ---
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
spring.cloud.stream.bindings.pageEventSupplier-out-0.contentType=application/json
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200

# --- Kafka Streams : lit T3, ecrit le resultat dans T4 ---
spring.cloud.stream.bindings.kafkaStreamFunction-in-0.destination=T3
spring.cloud.stream.bindings.kafkaStreamFunction-in-0.group=oussama-streams-analytics
spring.cloud.stream.bindings.kafkaStreamFunction-in-0.contentType=application/json
spring.cloud.stream.bindings.kafkaStreamFunction-out-0.destination=T4

# --- Reglages Kafka Streams ---
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.binder.configuration.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.cloud.stream.kafka.streams.binder.configuration.default.value.serde=org.springframework.kafka.support.serializer.JsonSerde
spring.cloud.stream.kafka.streams.binder.configuration.spring.json.value.default.type=ma.oussama.kafka.events.PageEvent
spring.cloud.stream.kafka.streams.binder.configuration.spring.json.trusted.packages=*
spring.cloud.stream.kafka.streams.binder.configuration.num.stream.threads=1

# --- Logs ---
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.cloud.stream=WARN
